<!doctype html>
<html lang="uk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1B5E7B" />
		<meta name="color-scheme" content="light dark" />
		<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

		%sveltekit.head%
		<!-- Інлайн-скрипти стоять ПІСЛЯ %sveltekit.head% навмисно.
		     SvelteKit вставляє <meta http-equiv="Content-Security-Policy"> саме
		     туди, а мета-політика діє лише на те, що йде після неї. Коли ці
		     скрипти стояли вище, CSP їх не стосувалася зовсім: хеш у
		     svelte.config.js обчислювався, вписувався і не захищав нічого.
		     Перевірено: прибирання хеша не змінювало нічого, поки блок був вище.
		     Затримка нульова — <head> до цього місця це кілька мета-тегів. -->
		<script>
			try {
				// ── ПЕРЕМИКАЧ ВАРІАНТА ЗАСТАВКИ ─────────────────────────────
				// Один рядок нижче — і заставка інша. ОБА варіанти лишаються в
				// коді назавжди; жоден не видаляється при перемиканні:
				//
				//   'curtains' — театральні куліси (SVG-велюр), що роз'їжджаються
				//                в боки. Розмітка: #app-splash-curtains нижче;
				//                стилі: «CURTAIN VARIANT» і «CURTAIN EXIT».
				//   'classic'  — суцільний жовтий фон, що з'їжджає вниз
				//                (початковий варіант). Стилі: #app-splash.splash-exit
				//                із `sp-splash-down`; куліси при ньому просто
				//                `display: none`, розмітка лишається в DOM.
				//
				// Обидва варіанти повністю робочі, і перемикання не потребує
				// нічого, крім заміни рядка. Зафіксовано в PROJECT-CONTEXT.md.
				//
				// УВАГА, якщо заставка «зникла» й лишився суцільний фон: спершу
				// подивись у консоль на порушення CSP. Цей скрипт — інлайн, і його
				// пускає лише хеш із `svelte.config.js`. Заблокований скрипт не
				// виставляє `data-splash`, тож CSS куліс не спрацьовує ЗОВСІМ, і
				// виглядає це рівно як «куліси видалили» (сталося 2026-08-23,
				// причина — CRLF у файлі; тримає інваріант `src/csp-hash.test.ts`).
				//
				// Ставиться першим: documentElement існує тут завжди, а нижчий
				// рядок цього ж скрипта може кинути ще до розбору <body>.
				window.__SPLASH_VARIANT = 'curtains';
				document.documentElement.setAttribute('data-splash', window.__SPLASH_VARIANT);

				// ── СМУГА ПРОКРУТКИ ─────────────────────────────────────────
				// Клас ставиться ТУТ, до першого кадру, а не в ефекті після
				// гідрації. Інакше на заставці встигала показатися нативна смуга
				// і зникала вже після неї — саме так, як із темою без цього
				// скрипта було б миготіння світлого тла.
				//
				// Умови мусять збігатися з `controllers/scrollbar.svelte.ts`:
				// на сенсорних пристроях і вузьких екранах лишається нативна.
				// Порядок важливий: власний вибір відвідувача → типове значення від
				// адміністратора (його кешує `ui.applyDefaults`, бо Firestore тут
				// прочитати нема як) → зашите значення. Без середньої ланки перший
				// кадр брав би 'custom', і у відвідувача без власного вибору смуга
				// перемикалася б уже після завантаження налаштувань — видимий стрибок.
				var sb =
					localStorage.getItem('teatralo4ka_scrollbarMode') ||
					localStorage.getItem('teatralo4ka_scrollbarModeDefault') ||
					'custom';
				var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
				var wide = window.matchMedia('(min-width: 1100px)').matches;
				var hidesNative =
					fine && (sb === 'custom' || ((sb === 'minimap' || sb === 'minimap-full') && wide));
				if (hidesNative) {
					document.documentElement.classList.add('has-custom-scrollbar');
				}

				var t = localStorage.getItem('teatralo4ka_theme');
				if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.setAttribute('data-theme', 'dark');
					document.documentElement.classList.add('dark-theme');
					document.documentElement.classList.remove('light-theme', 'yellow-theme', 'light-yellow-theme');
					document.querySelector('meta[name="color-scheme"]').content = 'dark';
				} else if (t === 'yellow') {
					document.documentElement.setAttribute('data-theme', 'yellow');
					document.documentElement.classList.add('yellow-theme');
					document.documentElement.classList.remove('dark-theme', 'light-theme', 'light-yellow-theme');
					document.querySelector('meta[name="color-scheme"]').content = 'light';
				} else if (t === 'light-yellow') {
					document.documentElement.setAttribute('data-theme', 'light-yellow');
					document.documentElement.classList.add('light-yellow-theme');
					document.documentElement.classList.remove('dark-theme', 'light-theme', 'yellow-theme');
					document.querySelector('meta[name="color-scheme"]').content = 'light';
				} else {
					document.documentElement.setAttribute('data-theme', 'light');
					document.documentElement.classList.add('light-theme');
					document.documentElement.classList.remove('dark-theme', 'yellow-theme', 'light-yellow-theme');
					document.querySelector('meta[name="color-scheme"]').content = 'light dark';
				}
				// Головна є двома адресами: '/' українською і '/en/' англійською
				// (I18N-v8 § 3.1). Порівняння лише з '/' лишало англійську
				// головну без класу `page-home`, а від нього залежить оформлення
				// саме цієї сторінки — тобто вона виглядала б як внутрішня.
				var p = window.location.pathname.replace(/^\/en(?=\/|$)/, '') || '/';
				if (p === '/' || p === '') {
					document.body.classList.add('page-home');
				}
			} catch (e) {}
		</script>
		<script src="%sveltekit.assets%/perf.js"></script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app-splash" aria-hidden="true">
			<!-- Curtain variant (active when <html data-splash="curtains">): two SVG velvet
			     panels that part to the sides. Hidden in the 'classic' variant via CSS. -->
			<div id="app-splash-curtains" aria-hidden="true">
				<div class="curtain curtain-left">
					<svg class="curtain-svg" viewBox="0 0 300 800" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
						<defs>
							<linearGradient id="sp-velvet-l" x1="0" y1="0" x2="1" y2="0">
								<stop offset="0" stop-color="#e6c200" />
								<stop offset="0.09" stop-color="#fff64d" />
								<stop offset="0.2" stop-color="#f4d900" />
								<stop offset="0.32" stop-color="#dcb600" />
								<stop offset="0.44" stop-color="#fff64d" />
								<stop offset="0.56" stop-color="#f4d900" />
								<stop offset="0.68" stop-color="#dcb600" />
								<stop offset="0.8" stop-color="#fff64d" />
								<stop offset="0.92" stop-color="#f2d500" />
								<stop offset="1" stop-color="#c49f00" />
							</linearGradient>
							<linearGradient id="sp-velvet-top-l" x1="0" y1="0" x2="0" y2="1">
								<stop offset="0" stop-color="#7a5c00" stop-opacity="0.35" />
								<stop offset="0.16" stop-color="#7a5c00" stop-opacity="0" />
							</linearGradient>
						</defs>
						<rect width="300" height="800" fill="url(#sp-velvet-l)" />
						<rect width="300" height="800" fill="url(#sp-velvet-top-l)" />
						<path d="M0,748 Q37,792 75,752 Q112,792 150,752 Q187,792 225,752 Q262,792 300,752 L300,800 L0,800 Z" fill="#b89400" opacity="0.55" />
					</svg>
				</div>
				<div class="curtain curtain-right">
					<svg class="curtain-svg" viewBox="0 0 300 800" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
						<defs>
							<linearGradient id="sp-velvet-r" x1="0" y1="0" x2="1" y2="0">
								<stop offset="0" stop-color="#c49f00" />
								<stop offset="0.08" stop-color="#f2d500" />
								<stop offset="0.2" stop-color="#fff64d" />
								<stop offset="0.32" stop-color="#dcb600" />
								<stop offset="0.44" stop-color="#f4d900" />
								<stop offset="0.56" stop-color="#fff64d" />
								<stop offset="0.68" stop-color="#dcb600" />
								<stop offset="0.8" stop-color="#f4d900" />
								<stop offset="0.91" stop-color="#fff64d" />
								<stop offset="1" stop-color="#e6c200" />
							</linearGradient>
							<linearGradient id="sp-velvet-top-r" x1="0" y1="0" x2="0" y2="1">
								<stop offset="0" stop-color="#7a5c00" stop-opacity="0.35" />
								<stop offset="0.16" stop-color="#7a5c00" stop-opacity="0" />
							</linearGradient>
						</defs>
						<rect width="300" height="800" fill="url(#sp-velvet-r)" />
						<rect width="300" height="800" fill="url(#sp-velvet-top-r)" />
						<path d="M0,752 Q37,792 75,752 Q112,792 150,752 Q187,792 225,752 Q262,792 300,748 L300,800 L0,800 Z" fill="#b89400" opacity="0.55" />
					</svg>
				</div>
			</div>

			<div id="app-splash-logo-container">
				<img
					src="%sveltekit.assets%/logo/svg/t4_logo_IndividualParticles_MaskRed_2026.svg"
					alt=""
					id="app-splash-logo-red"
					class="splash-svg"
				/>
				<img
					src="%sveltekit.assets%/logo/svg/t4_logo_IndividualParticles_MaskBlue_2026.svg"
					alt=""
					id="app-splash-logo-blue"
					class="splash-svg"
				/>
			</div>

			<div id="app-splash-messages">
				<div id="app-splash-slow" class="sp-msg">
					<p id="sp-slow-text"></p>
				</div>
				<div id="app-splash-facts" class="sp-msg sp-facts">
					<p id="sp-facts-intro" class="sp-facts-intro"></p>
					<div id="sp-facts-rotator" class="sp-facts-rotator">
						<!-- Facts will be inserted here by script -->
					</div>
				</div>
			</div>
		</div>

		<!-- Смуга прокрутки: правила мусять діяти на першому кадрі (SCROLLBAR-v8 § 8.1, § 8.3) -->
		<style>
			html.has-custom-scrollbar {
				scrollbar-width: none;
			}
			html.has-custom-scrollbar::-webkit-scrollbar {
				display: none;
			}
		</style>
		<style>
			#app-splash {
				position: fixed; inset: 0; z-index: 10000;
				background: #ffed00 !important;
				display: flex; flex-direction: column;
				align-items: center; justify-content: center;
				font-family: system-ui, -apple-system, sans-serif;
			}

			/* ── CURTAIN VARIANT ─────────────────────────────────────────── */
			#app-splash-curtains {
				position: absolute; inset: 0; z-index: 1;
				display: none; pointer-events: none;
			}
			html[data-splash="curtains"] #app-splash-curtains { display: block; }
			/* Curtains provide the yellow; the container itself goes transparent so
			   the page is revealed when the panels part. */
			html[data-splash="curtains"] #app-splash { background: transparent !important; }
			html[data-splash="curtains"] #app-splash-logo-container { z-index: 3; }
			html[data-splash="curtains"] #app-splash-messages { z-index: 3; }
			.curtain {
				position: absolute; top: 0; bottom: 0;
				width: 52%;                         /* >50% so the two panels overlap at center (no seam) */
				background: #ffed00;                /* solid fallback if the SVG fails to paint */
				overflow: hidden;
				will-change: transform;
				box-shadow: 0 0 45px rgba(122, 92, 0, 0.25);
			}
			.curtain-left { left: 0; transform-origin: left center; }
			.curtain-right { right: 0; transform-origin: right center; }
			.curtain-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

			#app-splash-logo-container {
				position: relative;
				width: min(400px, 60vw);
				aspect-ratio: 400 / 242;
				z-index: 2;
			}
			.splash-svg {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				opacity: 0;
				transform: scale(0.8);
			}

			#app-splash-messages {
				display: flex;
				flex-direction: column;
				align-items: center;
				width: 100%;
				min-height: 180px;
				margin-top: 2rem;
				z-index: 1;
				text-align: center;
			}
			.sp-msg {
				opacity: 0;
				transform: translateY(10px);
				transition: opacity 0.8s ease-out, transform 0.8s ease-out;
				padding: 0 1.5rem;
				max-width: 480px;
				display: block;
				pointer-events: none;
			}
			.sp-msg.sp-show {
				opacity: 1;
				transform: translateY(0);
				pointer-events: auto;
			}
			#app-splash-slow { margin-bottom: 1rem; }
			.sp-msg p { color: #5a4a00; font-size: 0.95rem; line-height: 1.5; margin: 0; }
			.sp-facts-intro { font-weight: 600; margin-bottom: 0.75rem !important; font-size: 0.85rem !important; opacity: 0.7; }
			.sp-facts-rotator { position: relative; height: 60px; }
			.sp-fact {
				display: none;
				position: absolute; top: 0; left: 0; right: 0;
				font-size: 1.05rem !important; font-weight: 500;
				animation: sp-fade-in 0.8s ease-out forwards;
			}
			.sp-fact.sp-fact-active { display: block; }

			#app-splash-logo-blue.sp-logo-animate {
				animation: sp-appear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards,
						   sp-pulse 2s ease-in-out infinite 0.8s;
			}
			#app-splash-logo-red.sp-logo-animate {
				animation: sp-appear 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards,
						   sp-pulse 2s ease-in-out infinite 0.9s;
			}

			/* ── EXIT SEQUENCE (Updated Timings) ─────────────────────────── */
			#app-splash.splash-exit {
				/* 4. Background moves down (Starts at 0.5s, no pause) */
				animation: sp-splash-down 0.4s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards !important;
				pointer-events: none;
			}
			#app-splash.splash-exit #app-splash-messages {
				/* 1. Text vanishes smoothly (0.0s - 0.3s) */
				animation: sp-fade-out 0.3s ease-in-out forwards !important;
			}
			#app-splash.splash-exit #app-splash-logo-red {
				/* 2. Red zooms out (0.1s - 0.4s) */
				animation: sp-zoom-out 0.3s 0.1s cubic-bezier(0.4, 0, 0.2, 1) both !important;
			}
			#app-splash.splash-exit #app-splash-logo-blue {
				/* 3. Blue zooms out (0.2s - 0.5s) */
				animation: sp-zoom-out 0.3s 0.2s cubic-bezier(0.4, 0, 0.2, 1) both !important;
			}

			@keyframes sp-appear {
				0% { opacity: 0; transform: scale(0.8); }
				100% { opacity: 1; transform: scale(1); }
			}
			@keyframes sp-pulse {
				0%, 100% { transform: scale(1); opacity: 1; }
				50% { transform: scale(1.06); opacity: 0.85; }
			}
			@keyframes sp-fade-in {
				0% { opacity: 0; transform: translateY(8px); }
				100% { opacity: 1; transform: translateY(0); }
			}
			@keyframes sp-fade-out {
				from { opacity: 1; transform: translateY(0); }
				to { opacity: 0; transform: translateY(-15px); }
			}
			@keyframes sp-zoom-out {
				0% { opacity: 1; transform: scale(1); }
				100% { opacity: 0; transform: scale(0.5); }
			}
			@keyframes sp-splash-down {
				to { transform: translateY(100vh); }
			}

			/* ── CURTAIN EXIT: panels part to the sides with a soft fabric sway ── */
			html[data-splash="curtains"] #app-splash.splash-exit {
				animation: none !important;          /* cancel the classic slide-down */
				background: transparent !important;
			}
			html[data-splash="curtains"] #app-splash.splash-exit .curtain-left {
				animation: sp-curtain-left 1s 0.35s cubic-bezier(0.7, 0, 0.2, 1) forwards !important;
			}
			html[data-splash="curtains"] #app-splash.splash-exit .curtain-right {
				animation: sp-curtain-right 1s 0.35s cubic-bezier(0.7, 0, 0.2, 1) forwards !important;
			}
			@keyframes sp-curtain-left {
				0%   { transform: translateX(0) skewX(0deg) scaleX(1); }
				14%  { transform: translateX(-2%) skewX(2deg) scaleX(1.03); }   /* slight billow */
				100% { transform: translateX(-101%) skewX(-5deg) scaleX(0.88); }
			}
			@keyframes sp-curtain-right {
				0%   { transform: translateX(0) skewX(0deg) scaleX(1); }
				14%  { transform: translateX(2%) skewX(-2deg) scaleX(1.03); }   /* slight billow */
				100% { transform: translateX(101%) skewX(5deg) scaleX(0.88); }
			}
			@media (prefers-reduced-motion: reduce) {
				html[data-splash="curtains"] #app-splash.splash-exit .curtain-left,
				html[data-splash="curtains"] #app-splash.splash-exit .curtain-right {
					animation: sp-fade-out 0.35s ease forwards !important;
				}
			}
		</style>
		<script src="%sveltekit.assets%/splash.js"></script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
