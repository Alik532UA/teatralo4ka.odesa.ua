# Автоматичні PR на оновлення залежностей (SECURITY-v8 § — HIGH: «залежності з
# відомими CVE без оновлення», DEPENDENCIES-v8 § 3).
#
# Гейт `npm audit --audit-level=high` у CI ловить факт, що вразливість є.
# Dependabot — те, що приносить виправлення, не чекаючи, поки хтось згадає
# запустити `npm audit fix`.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Групування залежностей за доменними зонами (2026-11-10).
    #
    # Раніше всі мінори й патчі йшли одним спільним PR (`patterns: ['*']`).
    # Це створювало дві критичні проблеми:
    # 1) Назва workflow-рану Dependabot Updates в Actions роздувалася до 400+
    #    символів («npm_and_yarn in / for @opentelemetry/api, @tiptap/core, ...»);
    # 2) Об'єднання 27 гетерогенних пакетів робило PR крихким: будь-яка дрібниця
    #    (як-от несумісність svelte-check чи одне застаріле правило eslint-disable)
    #    блокувала оновлення всіх інших 26 цілком стабільних бібліотек (Tiptap, Playwright тощо).
    #
    # Доменні групи ізолюють ризики:
    groups:
      # 15 пакетів редактора Tiptap: їх слід оновлювати суворо разом між собою,
      # але окремо від компілятора та лінтерів.
      tiptap:
        patterns:
          - '@tiptap/*'
          - 'tiptap-markdown'

      # Ядро Svelte та плагіни: вимагають окремої перевірки компіляції та типів.
      svelte:
        patterns:
          - 'svelte'
          - 'svelte-check'
          - '@sveltejs/*'

      # Інструменти якості коду: оновлення лінтерів часто змінює діагностику
      # і потребує точкового коригування src/eslint-baseline.test.ts.
      lint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - 'typescript-eslint'
          - 'svelte-eslint-parser'
          - 'globals'

      # E2E та accessibility тестування.
      testing:
        patterns:
          - '@playwright/*'
          - '@axe-core/*'

      # `vitest` і `@vitest/coverage-v8` тримають peer на точну версію vitest.
      # Мають завжди оновлюватися сумісно (і мажори, і мінори/патчі).
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'

    # Чого НЕ пропонувати, доки проєкт не переїде.
    #
    # `@sveltejs/vite-plugin-svelte@7` вимагає `vite@^8`, а тут `vite@^7.3.1`.
    # Це не оновлення, а міграція, яка тягне за собою SvelteKit, — і жоден PR
    # від бота її не зробить. Заміряно: PR #7 упав чотири рази з чотирьох, і
    # щоразу на тому самому:
    #     npm error peer vite@"^8.0.0-beta.7 || ^8.0.0" from
    #     @sveltejs/vite-plugin-svelte@7.3.0
    #
    # Двадцять із двадцяти падінь CI за останні сто прогонів — це ці дві PR на
    # перезапусках. Червоне в переліку перестає означати «дивись сюди», і саме
    # це тут лікується. Мінори й патчі плагіна їдуть як досі.
    ignore:
      - dependency-name: '@sveltejs/vite-plugin-svelte'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'deps'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
