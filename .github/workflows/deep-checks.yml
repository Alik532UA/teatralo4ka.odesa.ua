name: Deep Checks

# CI-CD-AND-TOOLS-v8 § 1.6.
#
# ЧОМУ ТРЕТІЙ WORKFLOW, А НЕ КРОКИ В ДВОХ НАЯВНИХ
#
# `deploy.yml` тримав УСІ перевірки перед розгортанням, і прогін тривав 40 хв
# 47 с — тобто виправлення однієї помилки в тексті публікувалося за сорок хвилин.
# Покрокові заміри (прогін 33772902182) показали, куди саме йшов час, і головним
# виявився НЕ той крок, на який вказувало відчуття:
#
#   Lighthouse ............ 22 хв 03 с
#   повне E2E ............. 13 хв 14 с
#   решта разом ........... ~5 хв
#
# Тобто аудит Lighthouse сам коштував більше за все інше разом. Обидва довгі
# кроки живуть тут; критичний шлях за тими самими замірами складається в ~7 хв.
#
# `gates.yml` для них не годиться, і це записано в ньому самому: він ходить по
# `pull_request`, зокрема від Dependabot, а той не отримує репозиторних
# секретів. Збірка й Playwright без `VITE_FIREBASE_*` падають — тобто червоний
# PR не з вини залежності, гейт, який доводиться вимикати.
#
# Тому глибокі перевірки живуть тут — окремим прогоном ПІСЛЯ деплою.
#
# ЧОМУ ПІСЛЯ, А НЕ ПАРАЛЕЛЬНО
#
# Прохання автора дослівне: «спочатку задеплоїти з критичними перевірками, а
# потім перевіряти все інше… всі довгі перевірки в окремий actions після
# деплою». Перша редакція цього файлу стояла на `push: main`, тобто паралельно —
# і це працювало, але змагалося з деплоєм за раннери: у ті самі хвилини в черзі
# стояли ще два прогони `gates.yml` на кожен Dependabot-PR.
#
# `workflow_run` знімає змагання й робить порядок таким, як він і мусить
# читатися: спершу сайт оновлено, далі перевіряється те, що оновлено.
#
# Ціна названа вголос: результат глибокого прогону приходить не через ~35 хв від
# push, а через ~42 — деплой (~7 хв) плюс сам прогін. Для перевірок, які НЕ
# блокують публікацію, сім хвилин затримки не коштують нічого.
#
# Друга ціна, менш очевидна: при впалому деплою глибокий прогін НЕ стартує
# взагалі (умова нижче). Тобто в червоний день про Lighthouse і мобільне E2E не
# буде відомо нічого — але й код у продакшн не поїхав, тож перевіряти нема що.
#
# ЩО САМЕ ЦЕ КОШТУЄ, І ЧОМУ ЦЕ ПРИЙНЯТО
#
# Регресія, видима лише на мобільному проєкті (цілі дотику, переповнення
# екрана), знахідка axe або просідання Lighthouse тепер МОЖУТЬ потрапити в
# продакшн і будуть видні приблизно за годину від push, а не до публікації.
# Свідоме рішення автора: «спочатку задеплоїти з критичними перевірками, а потім
# перевіряти все інше».
#
# У блокуючому шляху натомість лишився критичний набір E2E (`smoke`,
# `redirects`, `csp-static` на chromium — 64 с локально): він відповідає на
# питання «чи сайт узагалі цілий» — сторінки віддають вміст, canonical на
# власний домен, sitemap не бреше, перенаправлення працюють, CSP не блокує
# власні скрипти. Решта E2E — про подробиці, і саме вона коштувала 13 хвилин.
#
# ЧОМУ ЗБІРКА ТУТ СВОЯ, А НЕ АРТЕФАКТ ІЗ ДЕПЛОЮ
#
# Playwright і Lighthouse працюють над `build/`. Тепер, коли прогін і так чекає
# на деплой, артефакт `github-pages` можна було б завантажити — і це навіть
# точніше: перевірялися б РІВНО ті байти, що опубліковані. Ціна — `actions:
# read`, `download-artifact` з `run-id` і розпакування `artifact.tar`, тобто три
# нові способи почервоніти не через сайт. Власна збірка коштує 62 с (замір,
# прогін 33772902182) і не додає жодного. Обмін варто зробити окремо й свідомо.

# `workflow_run` бачить лише файл із ГІЛКИ ЗА ЗАМОВЧУВАННЯМ — правка в іншій
# гілці не діє, доки не влита в `main`. Назва в `workflows:` мусить точно
# збігатися з `name:` у `deploy.yml`; розходження не помітить ніщо, окрім того,
# що прогін просто не запуститься — тож її тримає `src/ci.test.ts`.
on:
  workflow_run:
    workflows: ["Deploy All Schools"]
    types: [completed]

permissions:
  contents: read

# Та сама причина, що в обох сусідніх файлах (CI-CD-AND-TOOLS-v8 § 1.3): пуш
# пачкою комітів при `true` лишає лише останній прогін, і крок, доданий у
# проміжному коміті, не виконується ЖОДНОГО разу.
concurrency:
  group: deep-checks
  cancel-in-progress: false

jobs:
  deep:
    runs-on: ubuntu-latest
    # Впалий деплой означає, що на продакшн НІЧОГО не поїхало, а причина вже
    # названа в самому деплою (`check`, `lint`, `test` чи критичне E2E). Глибокий
    # прогін на тому самому коміті дав би друге червоне з тієї самої причини —
    # шум, який привчає не дивитися на червоне.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # `ref` обов'язковий: без нього `workflow_run` чекаутить голову `main`, а
      # не той коміт, який щойно опублікували. При двох пушах підряд це
      # перевіряло б чужий код і звітувало б про нього як про свій.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Версія збігається з `engines.node`, `.nvmrc` і сусідніми воркфлоу —
      # інваріант `src/dependencies.test.ts` тримає їх разом.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Причина відпечатку — у `scripts/deps-hash.mjs` і в `deploy.yml`. Замір
      # 2026-09-04 саме тут: `npm ci` — 7 хв 03 с при `npm cache is not found`.
      - name: Відпечаток залежностей
        id: deps
        run: echo "hash=$(node scripts/deps-hash.mjs)" >> "$GITHUB_OUTPUT"

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ steps.deps.outputs.hash }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # Скриптом, а не `npm audit` напряму: 2026-09-04 деплой упав через
      # `503 Service Unavailable` від реєстру npm. `check-audit.mjs` розрізняє
      # знахідку (падіння) і недоступний реєстр (попередження й код 0).
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: npm run audit:ci

      - name: Build for school
        if: ${{ !cancelled() }}
        env:
          VITE_SCHOOL_ID: teatralo4ka.odesa.ua
          VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_APPCHECK_RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.deps.outputs.hash }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ПОВНИЙ набір, обидва проєкти — те, що з деплою й забрали.
      - name: E2E and accessibility (full)
        if: ${{ !cancelled() }}
        run: npx playwright test

      # Звіт зберігається завжди: у CI стоїть `retries: 2`, тож flaky лишає крок
      # зеленим, і `if: failure()` викидав би трейс саме тоді, коли він потрібен.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-deep
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Lighthouse Audit
        if: ${{ !cancelled() }}
        run: npx @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs
