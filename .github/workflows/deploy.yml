name: Deploy All Schools

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    strategy:
      matrix:
        # Для майбутнього розширення можна винести список у JSON
        school:
          - teatralo4ka.odesa.ua
      # Помилка однієї школи НЕ блокує білд решти
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      # --- Гейти якості (CODE-QUALITY-v8 § 6, CI-CD-AND-TOOLS-v8 § 1.6) ---
      # Без цих трьох кроків пайплайн був install -> build -> deploy: 57 тестів
      # існували в репозиторії і не виконувалися жодного разу.
      - name: Types and Svelte check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Поріг high, а не moderate: решта moderate — це транзитивні залежності
      # firebase-admin і svelte-i18n, для яких npm пропонує «фікс» у вигляді
      # відкату на firebase-admin@10 і svelte-i18n@3, тобто на кілька мажорів
      # назад. Такий гейт довелося б одразу вимкнути, а вимкнений гейт гірший
      # за відсутній: він створює враження, що перевірка є.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate static content
        run: npm run validate-content

      - name: Build for school
        env:
          VITE_SCHOOL_ID: ${{ matrix.school }}
          VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_APPCHECK_RECAPTCHA_SITE_KEY }}
        run: npm run build

      # Після build і ДО deploy: E2E перевіряє саме `build/`, тож запускати їх
      # раніше нема на чому, а пізніше — вже пізно. `npx playwright test`, а не
      # `npm run test:e2e`: збірка щойно була, збирати вдруге незащо.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
