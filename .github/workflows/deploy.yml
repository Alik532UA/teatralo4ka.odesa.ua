name: Deploy All Schools

on:
  push:
    branches: [main]

# CI-CD-AND-TOOLS-v8 § 1.3 + AI-AGENT-PITFALLS-v8 § 1.4.
#
# `cancel-in-progress: false` — не оптимізація, а умова того, щоб гейти взагалі
# виконувалися. Пуш пачкою комітів при `true` скасовує всі проміжні прогони й
# лишає останній; прогін, який УПЕРШЕ виконав би щойно доданий крок, не
# завершується ніколи. Саме так у двох сусідніх проєктах гейт `data-testid` був
# червоний від народження, і помітили це лише за кілька днів.
#
# Друга причина — сам деплой: `actions/deploy-pages` не терпить двох одночасних
# розгортань на один сайт, і без групи вони збиваються одне об одне.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Правила доступу Firestore — над емулятором (CLOUD-DATABASE-v8, CDB-RULES-GATE).
  #
  # Окремий job, а не крок у деплої: емулятор вимагає Java й не потребує збірки,
  # тож розгортання на нього не чекає. Той самий job стоїть у `gates.yml` — там
  # він ловить розходження до `main`, тут страхує пряме злиття.
  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Емулятор Firestore — java-процес. Без цього кроку `emulators:exec` падає
      # з «java not found», і виглядає це як зламані правила.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Причина відпечатку — у `scripts/deps-hash.mjs`, і вона коротко така:
      # `hashFiles('package-lock.json')` тут не працює НІКОЛИ, бо pre-commit
      # піднімає версію в lock-файлі на кожен коміт.
      - name: Відпечаток залежностей
        id: deps
        run: echo "hash=$(node scripts/deps-hash.mjs)" >> "$GITHUB_OUTPUT"

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ steps.deps.outputs.hash }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Перевірка правил доступу
        run: npm run check:rules

  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    strategy:
      matrix:
        # Для майбутнього розширення можна винести список у JSON
        school:
          - teatralo4ka.odesa.ua
      # Помилка однієї школи НЕ блокує білд решти
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      # DEPENDENCIES-v8 § 2.3 — версія збігається з `engines.node` і `.nvmrc`;
      # інваріант `src/dependencies.test.ts` тримає всі три разом.
      #
      # Було 20. Node 20 вийшов з підтримки 2026-04-30, тобто оновлень безпеки
      # для нього більше немає, а локальна розробка йде на 25 — раннер лишався
      # єдиним місцем, де код виконує EOL-рантайм. Vite 7 вимагає
      # `^20.19 || >=22.12`, тож 22 — найближчий чинний LTS.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # ЧОМУ КЕШ ТУТ СВІЙ, А НЕ `cache: "npm"` У setup-node
      #
      # Вбудований кеш беріг ключ від УСЬОГО `package-lock.json`, а
      # `.husky/pre-commit` кличе `bump-version`, який піднімає в ньому `version`
      # на КОЖЕН коміт. Тобто ключ був новий завжди, і в журналі кожного job
      # стояло `npm cache is not found` — кеш не влучав ані разу за весь час.
      #
      # Доки реєстр npm швидкий, це невидимо: 647 пакетів за 14 с (замір, прогін
      # 33772902182). 2026-09-04 реєстр деградував, і той самий крок дав 5 хв
      # 02 с у деплої (прогін 33862103373), 7 хв 03 с у глибоких перевірках і
      # 4 хв 09 с у гейтах — прямо в часі до публікації.
      #
      # Подробиці, чому саме відпечаток, а не один `restore-keys`, — у
      # `scripts/deps-hash.mjs`.
      - name: Відпечаток залежностей
        id: deps
        run: echo "hash=$(node scripts/deps-hash.mjs)" >> "$GITHUB_OUTPUT"

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ steps.deps.outputs.hash }}
          restore-keys: npm-${{ runner.os }}-

      # `--prefer-offline` — щоб теплий `~/.npm` справді використовувався: без
      # нього npm однаково питає реєстр про кожен пакет. `--no-audit` знімає ще
      # один похід у реєстр із install — аудит має власний крок у
      # `deep-checks.yml`, і саджати його всередину install означало б завалити
      # публікацію від чужого 503 (це вже сталося 2026-09-04).
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      # --- Гейти якості (CODE-QUALITY-v8 § 6, CI-CD-AND-TOOLS-v8 § 1.6) ---
      # Без цих трьох кроків пайплайн був install -> build -> deploy: 57 тестів
      # існували в репозиторії і не виконувалися жодного разу.
      - name: Types and Svelte check
        run: npm run check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Validate static content
        if: ${{ !cancelled() }}
        run: npm run validate-content

      - name: Build for school
        env:
          VITE_SCHOOL_ID: ${{ matrix.school }}
          VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_APPCHECK_RECAPTCHA_SITE_KEY }}
        run: npm run build

      # CI-CD-AND-TOOLS-v8 § 1.5 — єдина машинна перевірка правила «артефакт
      # збірки не комітиться» (VERSIONING-v8 § 1.4). Типова жертва —
      # `static/app-version.json` із моментом збірки: після кожного локального
      # білда дерево брудне, і ця зміна раз по раз їде в чужі коміти.
      - name: Збірка не змінює відстежувані файли
        run: git diff --exit-code

      # Після build і ДО deploy: E2E перевіряє саме `build/`, тож запускати їх
      # раніше нема на чому, а пізніше — вже пізно. `npx playwright test`, а не
      # `npm run test:e2e`: збірка щойно була, збирати вдруге незащо.
      #
      # Ключ — той самий відпечаток, що й для npm, і з тієї самої причини: ключ
      # `hashFiles('package-lock.json')` мінявся щокоміту, тож у журналі стояло
      # `Cache not found`, а в кінці — `Cache saved` на 268 МБ. Тобто браузери
      # качалися заново кожного разу, а сховище кешу (межа 10 ГБ) забивалося
      # копіями того самого.
      #
      # `restore-keys` тут безпечний, хоч і може підняти кеш під ІНШУ версію
      # Playwright: наступний `playwright install` доганяє чого бракує, а зайве
      # просто лежить на диску раннера.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.deps.outputs.hash }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # КРИТИЧНИЙ набір, а не весь: повне E2E коштувало 13,4 хв (замір, прогін
      # #151) і переїхало в `deep-checks.yml`, який іде паралельно й деплой не
      # блокує. Тут лишилося те, що відповідає на питання «чи сайт узагалі
      # цілий»: сторінки віддають вміст, canonical на власний домен, sitemap не
      # бреше, перенаправлення працюють, CSP не блокує власні скрипти. Заміряно
      # локально: 64 с проти 5,6 хв за повний набір обома проєктами.
      #
      # Лише `chromium`: мобільний проєкт подвоює час, а те, що він ловить
      # (цілі дотику, переповнення екрана), — саме подробиці, які тепер живуть у
      # глибокому прогоні.
      - name: E2E — критичний набір
        run: npx playwright test smoke redirects csp-static --project=chromium

      # Звіт зберігається ЗАВЖДИ, а не лише на падінні, і причина конкретна.
      #
      # У CI стоїть `retries: 2`, тож тест, який упав з першої спроби й пройшов
      # з другої, лишає крок ЗЕЛЕНИМ — `if: failure()` не спрацьовував, і звіт
      # ішов у смітник разом із трейсом. Заміряно на прогоні #151: два flaky в
      # `touch-targets.spec.ts` (`/` і `/contacts`), у повідомленні видно лише
      # обрізаний перелік видів, а трейс невдалої спроби `trace:
      # 'on-first-retry'` зібрав і викинув. Причину довелося виводити з коду
      # замість того, щоб прочитати.
      #
      # `!cancelled()`, а не `always()`: скасований прогін не має чого
      # вивантажувати, а сам крок затримував би скасування. Це вже ідіома цього
      # файлу — так само стоять `Lint` і `Unit tests` вище.
      #
      # `if-no-files-found: ignore` обов'язковий саме через це послаблення: крок
      # тепер виконується й тоді, коли впав `npm run check`, тобто до Playwright
      # черга не дійшла й теки немає. Типове `warn` дало б жовту примітку на
      # порожньому місці — той самий шум, проти якого це й зроблено.
      #
      # Ім'я з `matrix.school`: `upload-artifact` v4+ падає на другому артефакті
      # з тим самим ім'ям у прогоні. Сьогодні школа одна, але матриця стоїть
      # саме для розширення, і зі спільним ім'ям друга школа зламала б деплой
      # обох — причому лише тоді, коли її додадуть.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.school }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
