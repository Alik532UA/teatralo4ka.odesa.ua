name: Quality Gates

# CODE-QUALITY-v8 § 6.1 + CI-CD-AND-TOOLS-v8 § 1.6.
#
# ЧОМУ ОКРЕМИЙ WORKFLOW, А НЕ ЩЕ ОДИН ТРИГЕР У deploy.yml
#
# `deploy.yml` запускається лише на `push` у `main` — і це правильно, бо його
# робота закінчується розгортанням. Наслідок був у тому, що ВСІ гейти проєкту
# (`check`, `lint`, `test`, `audit`) виконувалися виключно там: у гілці `dev`,
# де йде вся робота, і в Dependabot-PR не перевірялося нічого.
#
# Ціна цієї прогалини заміряна, а не уявна: `npm run lint` у `dev` виходив із
# кодом 1 (`svelte/no-navigation-without-resolve` у `GraduateCard.svelte`) і
# лишався червоним, доки на нього не подивилися руками. Гейт, який не
# виконується, у звіті про якість не відрізняється від гейта, що не знайшов
# порушень — AI-AGENT-PITFALLS-v8 § 1.4.
#
# ЧОГО ТУТ НАВМИСНО НЕМАЄ: `build` і Playwright.
#
# Обидва вимагають секретів (`VITE_FIREBASE_*`, `VITE_APPCHECK_*`), а
# Dependabot-PR репозиторних секретів не отримує. Крок, що падає через
# відсутній секрет, — це червоний PR не з вини залежності, тобто гейт, який
# доводиться вимикати; такий гірший за відсутній (CODE-QUALITY-v8 § 6.4.1).
# Тому збірка й E2E лишаються в `deploy.yml` перед розгортанням, і ця межа
# записана в PROJECT-CONTEXT.md — мовчазна відсутність читалася б як покриття.

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

# `cancel-in-progress: false` тут із тієї самої причини, що й у deploy.yml
# (CI-CD-AND-TOOLS-v8 § 1.3): пуш пачкою комітів при `true` лишає лише останній
# прогін, і крок, доданий у проміжному коміті, не виконується ЖОДНОГО разу.
# Економія хвилин раннера на проєкті з одним автором не варта того, щоб знову
# отримати гейт, якого ніхто не бачив зеленим.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Правила доступу Firestore — над емулятором (CLOUD-DATABASE-v8, CDB-RULES-GATE).
  #
  # ОКРЕМИЙ JOB, а не крок у `gates`: емулятор вимагає Java, а решта гейтів — ні,
  # тож 20 секунд встановлення JDK не мають лежати на шляху `npm run lint`.
  #
  # ЧОМУ ЦЕ ВЗАГАЛІ ТУТ. Правила — єдина частина проєкту, стан якої не видно ні
  # в `src/`, ні у `build/`: вони виконуються на боці Firebase, і CI їх навіть не
  # деплоїть (це ручний крок). Статичний інваріант `src/firestore-rules.test.ts`
  # звіряє allowlist полів зі Zod-схемою, але правил не ВИКОНУЄ — тобто не може
  # сказати, чи адміністратор справді збереже статтю і чи справді не підвищить
  # себе до суперадміна.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # Емулятор Firestore — java-процес. Без цього кроку `emulators:exec` падає
      # з «java not found», і виглядає це як зламані правила.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      # 29 випадків: 10 «застосунок мусить це вміти» й 19 «сторонній не мусить
      # цього могти». Правило «дозволити все» валить другий набір, «заборонити
      # все» — перший; скрипт сам падає, якщо один із наборів спорожнів.
      - name: Перевірка правил доступу
        run: npm run check:rules

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Версія збігається з `engines.node` і `.nvmrc`; узгодженість усіх трьох
      # тримає інваріант `src/dependencies.test.ts` (§ 2.3).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Types and Svelte check
        run: npm run check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      # Поріг `high` і без `--omit=dev` — той самий, що в deploy.yml. Причина
      # відхилення в бік суворості записана там і в PROJECT-CONTEXT.md.
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

      - name: Validate static content
        if: ${{ !cancelled() }}
        run: npm run validate-content
